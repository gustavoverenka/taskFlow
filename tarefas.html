<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Tarefas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f1117; font-family: 'Inter', sans-serif; color: #e2e8f0; }
        .sidebar { background: #1a1d27; border-right: 1px solid #2a2d3a; width: 240px; min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; }
        .main { flex: 1; padding: 32px; overflow-y: auto; }
        .card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 14px; padding: 20px; }
        .input-dark { background: #0f1117; border: 1px solid #2a2d3a; color: #e2e8f0; border-radius: 10px; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s; width: 100%; }
        .input-dark::placeholder { color: #4a5068; }
        .input-dark:focus { border-color: #6366f1; }
        .btn-primary { background: #6366f1; color: white; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; white-space: nowrap; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: transparent; color: #a78bfa; border: 1px solid #3f3f5f; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s; white-space: nowrap; }
        .btn-secondary:hover { background: #211b35; border-color: #6366f1; color: #c4b5fd; }
        .tarefa-card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; transition: border-color 0.2s; }
        .tarefa-card:hover { border-color: #3a3d4a; }
        .tarefa-concluida { opacity: 0.5; }
        .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .badge-pendente { background: #2d1b4e; color: #a78bfa; }
        .badge-feita { background: #0d2d1e; color: #34d399; }
        .badge-baixa { background: #123044; color: #38bdf8; }
        .badge-media { background: #3a2a12; color: #fbbf24; }
        .badge-alta { background: #3a161f; color: #fb7185; }
        .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: #2a2d3a; }
        .stat-card { background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 16px 20px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: #4a5068; cursor: pointer; transition: all 0.2s; text-decoration: none; }
        .nav-item.active, .nav-item:hover { background: #2a2d3a; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 4px; }
    </style>
</head>
<body style="display:flex; min-height:100vh;">
    <div class="sidebar">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:32px; padding: 0 4px;">
            <div style="width:32px; height:32px; background:#6366f1; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2">
                    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
                </svg>
            </div>
            <span style="font-size:16px; font-weight:700; color:#e2e8f0;">TaskFlow</span>
        </div>

        <nav style="flex:1;">
            <div class="nav-item active">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
                Dashboard
            </div>
        </nav>

        <div style="border-top: 1px solid #2a2d3a; padding-top:16px; display:flex; align-items:center; justify-content:space-between;">
            <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:32px; height:32px; background:#2d1b4e; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; color:#a78bfa;" id="avatar">G</div>
                <span style="font-size:13px; color:#94a3b8;" id="nome-usuario">Usuario</span>
            </div>
            <button class="btn-icon" onclick="sair()" title="Sair">
                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#4a5068" stroke-width="2">
                    <path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="main">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:28px;">
            <div>
                <h1 style="font-size:22px; font-weight:700; color:#e2e8f0; margin:0;">Minhas Tarefas</h1>
                <p style="font-size:14px; color:#4a5068; margin:4px 0 0;" id="data-hoje"></p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:28px;">
            <div class="stat-card">
                <p style="font-size:12px; color:#4a5068; margin:0 0 6px;">Total</p>
                <p style="font-size:24px; font-weight:700; color:#e2e8f0; margin:0;" id="stat-total">0</p>
            </div>
            <div class="stat-card">
                <p style="font-size:12px; color:#4a5068; margin:0 0 6px;">Pendentes</p>
                <p style="font-size:24px; font-weight:700; color:#a78bfa; margin:0;" id="stat-pendentes">0</p>
            </div>
            <div class="stat-card">
                <p style="font-size:12px; color:#4a5068; margin:0 0 6px;">Concluidas</p>
                <p style="font-size:24px; font-weight:700; color:#34d399; margin:0;" id="stat-concluidas">0</p>
            </div>
        </div>

        <div class="card" style="margin-bottom:24px;">
            <p style="font-size:14px; font-weight:600; color:#94a3b8; margin:0 0 14px;">Nova tarefa</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <input id="titulo" class="input-dark" type="text" placeholder="Titulo da tarefa..." style="flex:2; min-width:200px;"/>
                <input id="descricao" class="input-dark" type="text" placeholder="Descricao (opcional)" style="flex:2; min-width:200px;"/>
                <select id="prioridade" class="input-dark" style="flex:1; min-width:140px;">
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA" selected>Media</option>
                    <option value="ALTA">Alta</option>
                </select>
                <input id="data-limite" class="input-dark" type="date" style="flex:1; min-width:150px;"/>
                <button class="btn-primary" onclick="criarTarefa()">+ Adicionar</button>
            </div>
            <p id="msg-criar" style="font-size:13px; margin-top:10px; display:none;"></p>
        </div>

        <div class="card" style="margin-bottom:24px;">
            <p style="font-size:14px; font-weight:600; color:#94a3b8; margin:0 0 14px;">Filtros</p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <select id="filtro-prioridade" class="input-dark" style="flex:1; min-width:160px;" onchange="carregarTarefas()">
                    <option value="">Todas as prioridades</option>
                    <option value="BAIXA">Baixa</option>
                    <option value="MEDIA">Media</option>
                    <option value="ALTA">Alta</option>
                </select>
                <select id="filtro-status" class="input-dark" style="flex:1; min-width:160px;" onchange="carregarTarefas()">
                    <option value="">Todos os status</option>
                    <option value="false">Pendentes</option>
                    <option value="true">Concluidas</option>
                </select>
                <button class="btn-secondary" onclick="limparFiltros()">Limpar filtros</button>
            </div>
        </div>

        <div>
            <p style="font-size:14px; font-weight:600; color:#94a3b8; margin:0 0 14px;">Lista de tarefas</p>
            <div id="lista-tarefas" style="display:flex; flex-direction:column; gap:10px;">
                <p style="color:#4a5068; font-size:14px; text-align:center; padding:40px 0;" id="msg-vazia">Nenhuma tarefa ainda. Crie a primeira!</p>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token')
        if (!token) window.location.href = 'index.html'

        document.getElementById('data-hoje').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })

        try {
            const payload = JSON.parse(atob(token.split('.')[1]))
            const nome = payload.nome || 'Usuario'
            document.getElementById('nome-usuario').textContent = nome
            document.getElementById('avatar').textContent = nome[0].toUpperCase()
        } catch {}

        window.onload = carregarTarefas

        function textoPrioridade(prioridade) {
            const nomes = { BAIXA: 'Baixa', MEDIA: 'Media', ALTA: 'Alta' }
            return nomes[prioridade] || 'Media'
        }

        function classePrioridade(prioridade) {
            const classes = { BAIXA: 'badge-baixa', MEDIA: 'badge-media', ALTA: 'badge-alta' }
            return classes[prioridade] || 'badge-media'
        }

        async function carregarTarefas() {
            const filtroPrioridade = document.getElementById('filtro-prioridade').value
            const filtroStatus = document.getElementById('filtro-status').value
            const params = new URLSearchParams()

            if (filtroPrioridade) params.append('prioridade', filtroPrioridade)
            if (filtroStatus !== '') params.append('concluida', filtroStatus)

            const query = params.toString()
            const url = `http://localhost:3000/tarefas${query ? `?${query}` : ''}`

            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                })
                const tarefas = await res.json()
                renderizarTarefas(tarefas)
            } catch {
                document.getElementById('lista-tarefas').innerHTML = '<p style="color:#f87171; font-size:14px; text-align:center; padding:40px 0;">Erro ao carregar. Servidor online?</p>'
            }
        }

        function renderizarTarefas(tarefas) {
            const lista = document.getElementById('lista-tarefas')
            const total = tarefas.length
            const concluidas = tarefas.filter(t => t.concluida).length
            const pendentes = total - concluidas

            document.getElementById('stat-total').textContent = total
            document.getElementById('stat-concluidas').textContent = concluidas
            document.getElementById('stat-pendentes').textContent = pendentes

            if (total === 0) {
                lista.innerHTML = '<p style="color:#4a5068; font-size:14px; text-align:center; padding:40px 0;">Nenhuma tarefa encontrada.</p>'
                return
            }

            lista.innerHTML = tarefas.map(t => `
                <div class="tarefa-card ${t.concluida ? 'tarefa-concluida' : ''}">
                    <div style="flex:1;">
                        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:${t.descricao || t.dataLimite ? '4px' : '0'};">
                            <span style="font-size:14px; font-weight:500; color:#e2e8f0; ${t.concluida ? 'text-decoration:line-through;' : ''}">${t.titulo}</span>
                            <span class="badge ${t.concluida ? 'badge-feita' : 'badge-pendente'}">${t.concluida ? 'Concluida' : 'Pendente'}</span>
                            <span class="badge ${classePrioridade(t.prioridade)}">${textoPrioridade(t.prioridade)}</span>
                        </div>
                        ${t.descricao ? `<p style="font-size:13px; color:#4a5068; margin:0;">${t.descricao}</p>` : ''}
                        ${t.dataLimite ? `<p style="font-size:12px; color:#64748b; margin:4px 0 0;">Prazo: ${new Date(t.dataLimite).toLocaleDateString('pt-BR')}</p>` : ''}
                    </div>
                    <div style="display:flex; gap:4px;">
                        ${!t.concluida ? `
                            <button class="btn-icon" onclick="completar(${t.id})" title="Concluir">
                                <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#34d399" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
                            </button>
                        ` : ''}
                        <button class="btn-icon" onclick="deletar(${t.id})" title="Deletar">
                            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#f87171" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>
            `).join('')
        }

        async function criarTarefa() {
            const titulo = document.getElementById('titulo').value.trim()
            const descricao = document.getElementById('descricao').value.trim()
            const prioridade = document.getElementById('prioridade').value
            const dataLimite = document.getElementById('data-limite').value
            const msg = document.getElementById('msg-criar')

            if (!titulo) {
                msg.textContent = 'Titulo obrigatorio!'
                msg.style.color = '#f87171'
                msg.style.display = 'block'
                return
            }

            await fetch('http://localhost:3000/tarefas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ titulo, descricao, prioridade, dataLimite })
            })

            document.getElementById('titulo').value = ''
            document.getElementById('descricao').value = ''
            document.getElementById('prioridade').value = 'MEDIA'
            document.getElementById('data-limite').value = ''
            msg.style.display = 'none'
            carregarTarefas()
        }

        async function completar(id) {
            await fetch(`http://localhost:3000/tarefas/${id}/completar`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${token}` }
            })
            carregarTarefas()
        }

        async function deletar(id) {
            if (!confirm('Deletar esta tarefa?')) return
            await fetch(`http://localhost:3000/tarefas/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            })
            carregarTarefas()
        }

        function limparFiltros() {
            document.getElementById('filtro-prioridade').value = ''
            document.getElementById('filtro-status').value = ''
            carregarTarefas()
        }

        function sair() {
            localStorage.removeItem('token')
            window.location.href = 'index.html'
        }
    </script>
</body>
</html>
